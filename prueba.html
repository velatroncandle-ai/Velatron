<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Phantom | Balance SOL + Token SPL</title>
  <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.6/lib/index.iife.min.js"></script>
  
  <style>
    body { font-family: Arial; background: #111; color: #fff; text-align: center; padding: 40px; }
    button {
      padding: 12px 20px;
      background: #6c5ce7;
      border: none;
      color: white;
      font-size: 18px;
      border-radius: 8px;
      margin: 10px;
      cursor: pointer;
    }
    #disconnectBtn { background: #d63031; display: none; }
    #info { margin-top: 20px; font-size: 18px; }
  </style>
</head>
<body>

  <h1>Phantom + Solana</h1>

  <button id="connectBtn">Conectar Phantom</button>
  <button id="disconnectBtn">Desconectar</button>

  <div id="info"></div>

  <script>
    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const infoDiv = document.getElementById("info");

    const TOKEN_MINT = "E5BCxeyFybFoG8waFAPJbcfuS1Pis2wowbCdz3hJpump"; // tu token SPL

    // ✅ Cambiar a tu Alchemy Free RPC
    const ALCHEMY_API_KEY = "KH_CbC8_e0Tp_HOjeUZpb"; // Copia tu API Key de Alchemy
    const connection = new solanaWeb3.Connection(
      `https://solana-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}`
    );

    let walletPublicKey = null;

    // --------------------------
    //  Conectar Phantom
    // --------------------------
    async function connectPhantom() {
      const provider = window.solana;

      if (!provider || !provider.isPhantom) {
        alert("Instala Phantom: https://phantom.app");
        return;
      }

      try {
        const resp = await provider.connect();
        walletPublicKey = resp.publicKey;

        infoDiv.innerHTML = `
          <p><strong>Wallet:</strong> ${walletPublicKey.toString()}</p>
        `;

        connectBtn.style.display = "none";
        disconnectBtn.style.display = "inline-block";

        await loadSOLBalance();
        await checkTokenBalance();

      } catch (e) {
        console.error(e);
        alert("Error al conectar Phantom");
      }
    }

    // --------------------------
    //  Desconectar
    // --------------------------
    async function disconnectPhantom() {
      try {
        await window.solana.disconnect();
      } catch (e) {}

      walletPublicKey = null;

      infoDiv.innerHTML = "Desconectado";

      disconnectBtn.style.display = "none";
      connectBtn.style.display = "inline-block";
    }

    // --------------------------
    // Mostrar balance SOL
    // --------------------------
    async function loadSOLBalance() {
      if (!walletPublicKey) return;

      try {
        const balanceLamports = await connection.getBalance(walletPublicKey);
        const balanceSOL = balanceLamports / solanaWeb3.LAMPORTS_PER_SOL;

        infoDiv.innerHTML += `
          <p><strong>Balance SOL:</strong> ${balanceSOL.toFixed(4)} SOL</p>
        `;
      } catch (e) {
        console.error("Error al obtener balance SOL:", e);
        infoDiv.innerHTML += `<p style="color:red">Error al obtener balance SOL</p>`;
      }
    }

    // --------------------------
    // Verificar si tiene un token SPL
    // --------------------------
    async function checkTokenBalance() {
      if (!walletPublicKey) return;

      try {
        const tokenAccounts = await connection.getParsedTokenAccountsByOwner(
          walletPublicKey,
          { mint: new solanaWeb3.PublicKey(TOKEN_MINT) }
        );

        if (tokenAccounts.value.length === 0) {
          infoDiv.innerHTML += `
            <p><strong>Token:</strong> ❌ No tiene este token</p>
          `;
          return;
        }

        const amount = tokenAccounts.value[0].account.data.parsed.info.tokenAmount.uiAmount;

        infoDiv.innerHTML += `
          <p><strong>Token:</strong> ✔ Sí tiene este token<br>
          <strong>Cantidad:</strong> ${amount}</p>
        `;
      } catch (e) {
        console.error("Error al obtener token SPL:", e);
        infoDiv.innerHTML += `<p style="color:red">Error al obtener token SPL</p>`;
      }
    }

    connectBtn.addEventListener("click", connectPhantom);
    disconnectBtn.addEventListener("click", disconnectPhantom);
  </script>

</body>
</html>
