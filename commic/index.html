  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, rgba(10,21,32,0.9), rgba(22,40,56,0.9)), 
                  url('fondo.jpg') center/cover fixed;
      font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    header {
      padding: 20px;
      background: linear-gradient(to bottom, rgba(10,21,32,0.95), rgba(10,21,32,0));
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    .brand {
      font-size: 32px;
      font-weight: bold;
      color: #00ff88;
      text-shadow: 0 0 20px rgba(0,255,136,0.5);
      letter-spacing: 2px;
    }

    .page {
      opacity: 0;
      transform: translateX(40px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      padding-top: 90px;
      min-height: 100vh;
      display: none;
    }

    .page.active {
      display: block;
      opacity: 1;
      transform: translateX(0);
    }

    .comic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .comic-item {
      background: linear-gradient(135deg, #1a2a3a 0%, #0f1f2f 100%);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      border: 2px solid rgba(0,255,136,0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .comic-item:hover { 
      transform: scale(1.05);
      border-color: rgba(0,255,136,0.6);
      box-shadow: 0 0 25px rgba(0,255,136,0.3);
    }
    .comic-item:active { transform: scale(0.98); }

    .comic-item img {
      width: 100%;
      height: 240px;
   
    }

    .comic-title {
      padding: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #00ff88;
      background: rgba(0,0,0,0.3);
      letter-spacing: 0.5px;
    }

    .search-container {
      max-width: 300px;
      margin: 0 20px 30px 20px;
      padding: 0;
      position: relative;
    }

    .search-box {
      width: 100%;
      padding: 14px 50px 14px 20px;
      background: linear-gradient(135deg, #1a2a3a 0%, #0f1f2f 100%);
      border: 2px solid rgba(0,255,136,0.3);
      border-radius: 25px;
      color: #e0e0e0;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .search-box:focus {
      border-color: #00ff88;
      box-shadow: 0 0 20px rgba(0,255,136,0.3);
    }

    .search-box::placeholder {
      color: rgba(224,224,224,0.5);
    }

    .search-icon {
      position: absolute;
      right: 35px;
      top: 50%;
      transform: translateY(-50%);
      color: #00ff88;
      font-size: 20px;
      pointer-events: none;
    }

    /* Reader */
    #reader {
      padding-top: 80px;
    }

    .reader-img {
      width: 100%;
      max-width: 800px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 10px;
      touch-action: pan-y pinch-zoom;
      cursor: pointer;
      object-fit: contain;
      transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.6s ease;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    /* Contenedor para efecto de página */
    .reader-container {
      perspective: 2500px;
      position: relative;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 0;
      transform-style: preserve-3d;
    }

    /* Overlay de sombra durante el doblez */
    .page-shadow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, transparent 50%);
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    /* Animación realista de doblez hacia la derecha (siguiente página) */
    @keyframes pageFlipNext {
      0% {
        transform: perspective(2500px) rotateY(0deg) translateZ(0px) scale(1);
        opacity: 1;
        filter: brightness(1);
      }
      15% {
        transform: perspective(2500px) rotateY(-3deg) translateZ(20px) scale(1.02);
        opacity: 1;
        filter: brightness(1.1);
      }
      40% {
        transform: perspective(2500px) rotateY(-85deg) translateZ(100px) translateX(50px) scale(0.95);
        opacity: 0.7;
        filter: brightness(0.6);
      }
      60% {
        transform: perspective(2500px) rotateY(-95deg) translateZ(100px) translateX(50px) scale(0.95);
        opacity: 0.3;
        filter: brightness(0.4);
      }
      80% {
        transform: perspective(2500px) rotateY(-3deg) translateZ(20px) scale(1.02);
        opacity: 0.8;
        filter: brightness(1.1);
      }
      100% {
        transform: perspective(2500px) rotateY(0deg) translateZ(0px) scale(1);
        opacity: 1;
        filter: brightness(1);
      }
    }

    /* Animación realista de doblez hacia la izquierda (página anterior) */
    @keyframes pageFlipPrev {
      0% {
        transform: perspective(2500px) rotateY(0deg) translateZ(0px) scale(1);
        opacity: 1;
        filter: brightness(1);
      }
      15% {
        transform: perspective(2500px) rotateY(3deg) translateZ(20px) scale(1.02);
        opacity: 1;
        filter: brightness(1.1);
      }
      40% {
        transform: perspective(2500px) rotateY(85deg) translateZ(100px) translateX(-50px) scale(0.95);
        opacity: 0.7;
        filter: brightness(0.6);
      }
      60% {
        transform: perspective(2500px) rotateY(95deg) translateZ(100px) translateX(-50px) scale(0.95);
        opacity: 0.3;
        filter: brightness(0.4);
      }
      80% {
        transform: perspective(2500px) rotateY(3deg) translateZ(20px) scale(1.02);
        opacity: 0.8;
        filter: brightness(1.1);
      }
      100% {
        transform: perspective(2500px) rotateY(0deg) translateZ(0px) scale(1);
        opacity: 1;
        filter: brightness(1);
      }
    }

    /* Clase para animar siguiente página */
    .reader-img.flip-next {
      animation: pageFlipNext 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      transform-origin: left center;
    }

    /* Clase para animar página anterior */
    .reader-img.flip-prev {
      animation: pageFlipPrev 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      transform-origin: right center;
    }

    /* Efecto hover sobre la imagen - sutil levantamiento */
    .reader-img:hover {
      transform: perspective(2500px) translateZ(10px) scale(1.01);
      box-shadow: 0 20px 60px rgba(0, 255, 136, 0.3), 0 0 40px rgba(0, 0, 0, 0.8);
    }

    /* Animación de curl en la esquina */
    @keyframes cornerCurl {
      0%, 100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
      50% { clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 0 100%); }
    }

    .reader-controls {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      padding: 20px;
      background: linear-gradient(to bottom, #0a1520 0%, #0f1f2f 100%);
      z-index: 999;
      box-shadow: 0 2px 15px rgba(0,255,136,0.2);
      border-bottom: 1px solid rgba(0,255,136,0.2);
    }

    button {
      background: linear-gradient(135deg, #1a3a2a 0%, #0f2520 100%);
      border: 2px solid #00ff88;
      padding: 12px 24px;
      border-radius: 8px;
      color: #00ff88;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s ease;
      white-space: nowrap;
      font-weight: 600;
      touch-action: manipulation;
      margin: 0 5px;
      text-shadow: 0 0 10px rgba(0,255,136,0.5);
      box-shadow: 0 0 15px rgba(0,255,136,0.2);
    }

    button:hover { 
      background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
      color: #0a1520;
      border-color: #00ff88;
      box-shadow: 0 0 25px rgba(0,255,136,0.5);
      text-shadow: none;
    }
    button:active { 
      transform: scale(0.97);
      box-shadow: 0 0 10px rgba(0,255,136,0.3);
    }

    /* Optimización móvil */
    @media (max-width: 768px) {
      .comic-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
        padding: 15px;

      }

      .reader-img {

        width: 100%;
        border-radius: 0;
        margin: 0;
      }

      .reader-controls {
        gap: 0;
        padding: 12px 8px;
      }

        padding: 10px 16px;
        font-size: 13px;
        margin: 0 2px;
      }

        font-size: 18px;

      .page {

      }

      #reader {
        padding-top: 65px;
      }

      header {
        padding: 15px;
      }

      .search-container {

        padding: 0;

      .search-box {
        padding: 12px 45px 12px 15px;

      }

      .search-icon {
        right: 25px;
        font-size: 18px;
      }
    }

    @media (max-width: 480px) {

        grid-template-columns: repeat(2, 1fr);

      .page {

      .search-box {

      .search-icon {

      h2 {

    @media (max-width: 360px) {
      button {

        margin: 0 10px 12px 10px;
        padding: 0;
      }

      .search-box {
        padding: 9px 38px 9px 10px;
        font-size: 12px;
      }

      .search-icon {
        right: 20px;
        font-size: 15px;
      }

      h2 {
        font-size: 18px !important;
        padding-left: 10px !important;
      }
    }

    let currentComic = [];
    let pageIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;
    const swipeThreshold = 50; // píxeles mínimos para detectar swipe

    function openComic(temporada = 'temporada1') {
      currentComic = comics[temporada] || comics.temporada1;
      switchPage('reader');
      loadPage(0);
      initTouchControls();
      // Ocultar controles de wallet
      document.querySelector('.wallet-controls').style.display = 'none';
    }

    function goHome() {
      switchPage('home');
      // Mostrar controles de wallet
      document.querySelector('.wallet-controls').style.display = 'flex';
    }

    function switchPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function loadPage(index, direction = 'next') {
      if (index >= 0 && index < currentComic.length) {
        pageIndex = index;
        const img = document.getElementById('comicPage');
        
        // Remover clases anteriores
        img.classList.remove('flip-next', 'flip-prev');
        
        // Agregar clase según dirección con pequeño delay para trigger
        setTimeout(() => {
          img.classList.add(direction === 'next' ? 'flip-next' : 'flip-prev');
        }, 10);
        
        // Cambiar la imagen en el punto medio de la animación (cuando está de lado)
        setTimeout(() => {
          img.src = currentComic[index];
        }, 500);
        
        // Limpiar clase después de la animación completa
        setTimeout(() => {
          img.classList.remove('flip-next', 'flip-prev');
        }, 1000);
      }
    }

    function nextPage() { 
      if (pageIndex < currentComic.length - 1) {
        loadPage(pageIndex + 1, 'next');
      }
    }
    
    function prevPage() { 
      if (pageIndex > 0) {
        loadPage(pageIndex - 1, 'prev');
      }
    }

    // Función de búsqueda
    function filterComics() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const comicItems = document.querySelectorAll('.comic-item');
      
      comicItems.forEach(item => {
        const title = item.querySelector('.comic-title').textContent.toLowerCase();
        if (title.includes(searchTerm)) {
          item.style.display = '';
        } else {
          item.style.display = 'none';
        }
      });
    }

    // Control táctil por deslizamiento y clic
    function initTouchControls() {
      const comicImg = document.getElementById('comicPage');
      
      comicImg.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      comicImg.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });

      // Clic/tap para avanzar
      comicImg.addEventListener('click', () => {
        nextPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      
      // Deslizar hacia la izquierda (siguiente página)
      if (swipeDistance < -swipeThreshold) {
        nextPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      
      // Deslizar hacia la derecha (página anterior)
      if (swipeDistance > swipeThreshold) {
        prevPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // Inicializar en carga de página si ya estamos en el lector
    window.addEventListener('DOMContentLoaded', () => {
      if (document.getElementById('reader').classList.contains('active')) {
        initTouchControls();
      }
    });
