<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CómicFlix Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.6/lib/index.iife.min.js"></script>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, rgba(10,21,32,0.9), rgba(22,40,56,0.9)), 
                  url('fondo.jpg') center/cover fixed;
      font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    header {
      padding: 20px;
      background: linear-gradient(to bottom, rgba(10,21,32,0.95), rgba(10,21,32,0));
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    .brand {
      font-size: 32px;
      font-weight: bold;
      color: #00ff88;
      text-shadow: 0 0 20px rgba(0,255,136,0.5);
      letter-spacing: 2px;
    }

    .page {
      opacity: 0;
      transform: translateX(40px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      padding-top: 90px;
      min-height: 100vh;
      display: none;
    }

    .page.active {
      display: block;
      opacity: 1;
      transform: translateX(0);
    }

    .comic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .comic-item {
      background: linear-gradient(135deg, #1a2a3a 0%, #0f1f2f 100%);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      border: 2px solid rgba(0,255,136,0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .comic-item:hover { 
      transform: scale(1.05);
      border-color: rgba(0,255,136,0.6);
      box-shadow: 0 0 25px rgba(0,255,136,0.3);
    }
    .comic-item:active { transform: scale(0.98); }

    .comic-item img {
      width: 100%;
      height: 240px;
   
    }

    .comic-title {
      padding: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #00ff88;
      background: rgba(0,0,0,0.3);
      letter-spacing: 0.5px;
    }

    .search-container {
      max-width: 300px;
      margin: 0 20px 30px 20px;
      padding: 0;
      position: relative;
    }

    .search-box {
      width: 100%;
      padding: 14px 50px 14px 20px;
      background: linear-gradient(135deg, #1a2a3a 0%, #0f1f2f 100%);
      border: 2px solid rgba(0,255,136,0.3);
      border-radius: 25px;
      color: #e0e0e0;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .search-box:focus {
      border-color: #00ff88;
      box-shadow: 0 0 20px rgba(0,255,136,0.3);
    }

    .search-box::placeholder {
      color: rgba(224,224,224,0.5);
    }

    .search-icon {
      position: absolute;
      right: 35px;
      top: 50%;
      transform: translateY(-50%);
      color: #00ff88;
      font-size: 20px;
      pointer-events: none;
    }

    /* Reader */
    #reader {
      padding-top: 80px;
    }

    .reader-img {
      width: 100%;
      max-width: 800px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 10px;
      touch-action: pan-y pinch-zoom;
      cursor: pointer;
      object-fit: contain;
      transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.6s ease;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    /* Contenedor para efecto de página */
    .reader-container {
      perspective: 2500px;
      position: relative;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 0;
      transform-style: preserve-3d;
    }

    /* Overlay de sombra durante el doblez */
    .page-shadow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, transparent 50%);
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    /* Animación realista de doblez hacia la derecha (siguiente página) */
    @keyframes pageFlipNext {
      0% {
        transform: perspective(2500px) rotateY(0deg) translateZ(0px) scale(1);
        opacity: 1;
        filter: brightness(1);
      }
      15% {
        transform: perspective(2500px) rotateY(-3deg) translateZ(20px) scale(1.02);
        opacity: 1;
        filter: brightness(1.1);
      }
      40% {
        transform: perspective(2500px) rotateY(-85deg) translateZ(100px) translateX(50px) scale(0.95);
        opacity: 0.7;
        filter: brightness(0.6);
      }
      60% {
        transform: perspective(2500px) rotateY(-95deg) translateZ(100px) translateX(50px) scale(0.95);
        opacity: 0.3;
        filter: brightness(0.4);
      }
      80% {
        transform: perspective(2500px) rotateY(-3deg) translateZ(20px) scale(1.02);
        opacity: 0.8;
        filter: brightness(1.1);
      }
      100% {
        transform: perspective(2500px) rotateY(0deg) translateZ(0px) scale(1);
        opacity: 1;
        filter: brightness(1);
      }
    }

    /* Animación realista de doblez hacia la izquierda (página anterior) */
    @keyframes pageFlipPrev {
      0% {
        transform: perspective(2500px) rotateY(0deg) translateZ(0px) scale(1);
        opacity: 1;
        filter: brightness(1);
      }
      15% {
        transform: perspective(2500px) rotateY(3deg) translateZ(20px) scale(1.02);
        opacity: 1;
        filter: brightness(1.1);
      }
      40% {
        transform: perspective(2500px) rotateY(85deg) translateZ(100px) translateX(-50px) scale(0.95);
        opacity: 0.7;
        filter: brightness(0.6);
      }
      60% {
        transform: perspective(2500px) rotateY(95deg) translateZ(100px) translateX(-50px) scale(0.95);
        opacity: 0.3;
        filter: brightness(0.4);
      }
      80% {
        transform: perspective(2500px) rotateY(3deg) translateZ(20px) scale(1.02);
        opacity: 0.8;
        filter: brightness(1.1);
      }
      100% {
        transform: perspective(2500px) rotateY(0deg) translateZ(0px) scale(1);
        opacity: 1;
        filter: brightness(1);
      }
    }

    /* Clase para animar siguiente página */
    .reader-img.flip-next {
      animation: pageFlipNext 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      transform-origin: left center;
    }

    /* Clase para animar página anterior */
    .reader-img.flip-prev {
      animation: pageFlipPrev 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      transform-origin: right center;
    }

    /* Efecto hover sobre la imagen - sutil levantamiento */
    .reader-img:hover {
      transform: perspective(2500px) translateZ(10px) scale(1.01);
      box-shadow: 0 20px 60px rgba(0, 255, 136, 0.3), 0 0 40px rgba(0, 0, 0, 0.8);
    }

    /* Animación de curl en la esquina */
    @keyframes cornerCurl {
      0%, 100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
      50% { clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 0 100%); }
    }

    .reader-controls {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      padding: 20px;
      background: linear-gradient(to bottom, #0a1520 0%, #0f1f2f 100%);
      z-index: 999;
      box-shadow: 0 2px 15px rgba(0,255,136,0.2);
      border-bottom: 1px solid rgba(0,255,136,0.2);
    }

    button {
      background: linear-gradient(135deg, #1a3a2a 0%, #0f2520 100%);
      border: 2px solid #00ff88;
      padding: 12px 24px;
      border-radius: 8px;
      color: #00ff88;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s ease;
      white-space: nowrap;
      font-weight: 600;
      touch-action: manipulation;
      margin: 0 5px;
      text-shadow: 0 0 10px rgba(0,255,136,0.5);
      box-shadow: 0 0 15px rgba(0,255,136,0.2);
    }

    button:hover { 
      background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
      color: #0a1520;
      border-color: #00ff88;
      box-shadow: 0 0 25px rgba(0,255,136,0.5);
      text-shadow: none;
    }
    button:active { 
      transform: scale(0.97);
      box-shadow: 0 0 10px rgba(0,255,136,0.3);
    }

    /* Optimización móvil */
    @media (max-width: 768px) {
      .comic-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
        padding: 15px;
      }

      .comic-item img {
        height: 200px;
      }

      .reader-img {
        max-width: 100%;
        width: 100%;
        border-radius: 0;
        margin: 0;
      }

      .reader-controls {
        gap: 0;
        padding: 12px 8px;
      }

      button {
        padding: 10px 16px;
        font-size: 13px;
        margin: 0 2px;
      }

      h2 {
        font-size: 18px;
        padding-left: 15px !important;
      }

      .page {
        padding-top: 65px;
      }

      #reader {
        padding-top: 65px;
      }

      header {
        padding: 15px;
      }

      .search-container {
        margin: 0 15px 20px 15px;
        padding: 0;
      }

      .search-box {
        padding: 12px 45px 12px 15px;
        font-size: 14px;
      }

      .search-icon {
        right: 25px;
        font-size: 18px;
      }
    }

    @media (max-width: 480px) {
      .comic-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 12px;
      }

      .comic-item {
        border-radius: 8px;
      }

      .comic-item img {
        height: 180px;
      }

      .comic-title {
        font-size: 14px;
        padding: 8px;
      }

      button {
        padding: 8px 12px;
        font-size: 12px;
        margin: 0 1px;
      }

      .brand {
        font-size: 20px;
      }

      #reader {
        padding-top: 60px;
      }

      .page {
        padding-top: 60px;
      }

      .reader-controls {
        padding: 10px 5px;
      }

      .search-container {
        margin: 0 12px 15px 12px;
        padding: 0;
      }

      .search-box {
        padding: 10px 40px 10px 12px;
        font-size: 13px;
        border-radius: 20px;
      }

      .search-icon {
        right: 22px;
        font-size: 16px;
      }

      h2 {
        font-size: 20px !important;
        padding-left: 12px !important;
      }
    }

    @media (max-width: 360px) {
      button {
        padding: 8px 10px;
        font-size: 11px;
      }

      .comic-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 10px;
      }

      .comic-title {
        font-size: 13px;
        padding: 6px;
      }

      .search-container {
        margin: 0 10px 12px 10px;
        padding: 0;
      }

      .search-box {
        padding: 9px 38px 9px 10px;
        font-size: 12px;
      }

      .search-icon {
        right: 20px;
        font-size: 15px;
      }

      h2 {
        font-size: 18px !important;
        padding-left: 10px !important;
      }
    }

      #disconnectBtn { background: #d63031; display: none; }
    #info { margin-top: 20px; font-size: 18px; }
    
    .wallet-controls {
      position: absolute;
      right: 10%;
      top: 20px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }
    
    .wallet-controls button {
      margin: 0;

/* Se ve bloqueado  */
.comic-item {
  position: relative;
  opacity: 1;
  transition: 0.3s;
  cursor: pointer;
}

.comic-item.locked {
  opacity: 0.5;        /* Se ve bloqueado */
}

.lock-icon {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: rgba(0,0,0,0.7);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 20px;

.comic-item.locked .lock-icon {
  display: block;    /* Candado visible si está bloqueado */

.comic-stats {
  position: absolute;

  display: flex;
  justify-content: space-between;
  align-items: center;

.stat-item {

}

@media (max-width: 480px) {
  .comic-stats {
    padding: 4px 8px;

  }
  
  .stat-icon {
    font-size: 14px;

}

    
/* Sistema de likes y puntuación */
.comic-interactions {
  position: fixed;
  bottom: 20px;

  background: linear-gradient(135deg, #1a2a3a 0%, #0f1f2f 100%);

  box-shadow: 0 10px 30px rgba(0,0,0,0.6);

  min-width: 200px;

}

.like-section {
  text-align: center;
  margin-bottom: 15px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(0,255,136,0.2);
}

.like-button {
  background: transparent;
  border: none;
  font-size: 40px;
  cursor: pointer;
  transition: all 0.3s ease;
  padding: 5px;
  margin: 0;
  filter: grayscale(100%);
}

.like-button:hover {
  transform: scale(1.2);
  filter: grayscale(0%);
}

.like-button.liked {
  filter: grayscale(0%);

}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.3); }
  50% { transform: scale(1.1); }
  75% { transform: scale(1.25); }
}

.like-count {

.rating-title {

}

.star-rating {

}

.star {

}

.star:hover,

}

.rating-display {
  text-align: center;

}

.rating-bar {

}

.rating-bar-fill {

.donate-section {

}

.donate-button {

  border-radius: 25px;
  color: #000;

  cursor: pointer;

.donate-button:hover {

}

.donate-button:active {

}

@media (max-width: 768px) {
  .comic-interactions {
    bottom: 10px;
    right: 10px;
    padding: 15px;
    min-width: 160px;
  }
  
  .like-button {

  .star {
    font-size: 24px;
  }
  
  .donate-button {
    padding: 10px 15px;

  </style>

  <script>
    
    // Lista de temporadas con sus imágenes (se carga dinámicamente desde el servidor)
    let comics = {};
    
    // Mapeo de metadata de los cómics
    let comicsMetadata = {};

    // Cargar cómics dinámicamente desde el servidor o JSON
    async function loadComicsFromServer() {
      try {
        // Intentar primero desde el servidor Python
        const response = await fetch('http://localhost:5000/list-comics');
        const data = await response.json();
        
        if (data.success && data.comics) {
          processComicsData(data.comics);
          console.log('✅ Cómics cargados desde servidor Python:', Object.keys(comics).length);
          return true;
        }
      } catch (error) {
        console.log('⚠️ Servidor Python no disponible, intentando con comics.json...');
        
        // Fallback: intentar cargar desde comics.json
        try {
          const response = await fetch('comics.json');
          const data = await response.json();
          processComicsData(data);
          console.log('✅ Cómics cargados desde comics.json:', Object.keys(comics).length);
          return true;
        } catch (jsonError) {
          console.error('❌ Error: No se pudo cargar ningún cómic');
          console.error('- Servidor Python no disponible en http://localhost:5000');
          console.error('- Archivo comics.json no encontrado');
          console.error('Soluciones:');
          console.error('1. Inicia el servidor: python server.py');
          console.error('2. O genera comics.json: python generate_comics_json.py');
          return false;
        }
      }
    }

    // Procesar datos de cómics desde cualquier fuente
    function processComicsData(comicsData) {
      const newComics = {};
      comicsMetadata = {};
      
      // Mapear los datos al formato esperado

      // Deslizar hacia la izquierda (siguiente página)
      if (swipeDistance < -swipeThreshold) {
        nextPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      if (swipeDistance > swipeThreshold) {

function desactivarClickComic() {
  const comicsBloqueados = document.querySelectorAll(
    ".comic-grid .comic-item"
  );

  comicsBloqueados.forEach(comic => {
    if (comic.id) {
      //desactivarClic(comic.id);
        document.getElementById(comic.id).style.pointerEvents = "none";
    }
  });
}

function activarClicComics() {
  const comicsBloqueados = document.querySelectorAll(
    ".comic-grid .comic-item"
  );

  comicsBloqueados.forEach(comic => {
    if (comic.id) {
     // activarClic(comic.id);
     document.getElementById(comic.id).style.pointerEvents = "auto";
    }
  });
}

function desbloCommic() {
  const todosLosComics = document.querySelectorAll(
  ".comic-grid .comic-item"
);
todosLosComics.forEach(comic => {
  comic.classList.remove("locked");

  const lockIcon = comic.querySelector(".lock-icon");
  if (lockIcon) lockIcon.remove();
});
}

function bloquearComic() {
  const todosLosComics = document.querySelectorAll(
    ".comic-grid .comic-item"
  );

  todosLosComics.forEach(comic => {
    // 1️⃣ Agregar estilo bloqueado
    comic.classList.add("locked");

    // 2️⃣ Desactivar clic
    comic.style.pointerEvents = "none";

    // 3️⃣ Agregar icono 🔒 si no existe
    if (!comic.querySelector(".lock-icon")) {
      const lock = document.createElement("div");
      lock.className = "lock-icon";
      lock.textContent = "🔒";
      comic.appendChild(lock);
    }
  });
}
